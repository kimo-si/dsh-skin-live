<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="dsh-skin-live 图层原理示意">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d93f8"/>
      <stop offset="1" stop-color="#2f4c8f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b98ad"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#10131a"/>

  <text x="36" y="44" fill="#e8ecf4" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="600">dsh-skin-live 图层原理示意</text>
  <text x="36" y="68" fill="#8b98ad" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">只改背景层，布局、尺寸、间距全部不动</text>

  <!-- 背景层 -->
  <rect x="36" y="96" width="380" height="230" rx="14" fill="url(#bg)"/>
  <circle cx="120" cy="150" r="22" fill="#f7ad31" fill-opacity="0.9"/>
  <path d="M36 300 L150 216 L228 280 L296 224 L416 302 L416 326 L36 326 z" fill="#0d1b33" fill-opacity="0.45"/>
  <text x="52" y="122" fill="#ffffff" fill-opacity="0.85" font-family="ui-monospace, Menlo, monospace" font-size="12">背景层 · position: fixed · z-index: -1</text>

  <!-- 应用界面（半透明玻璃） -->
  <rect x="60" y="150" width="332" height="152" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="80" y="172" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="80" y="200" width="292" height="52" rx="10" fill="#ffffff" fill-opacity="0.20"/>
  <rect x="96" y="216" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.45"/>
  <rect x="96" y="234" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.30"/>
  <rect x="80" y="266" width="292" height="24" rx="8" fill="#ffffff" fill-opacity="0.16"/>
  <text x="80" y="284" fill="#ffffff" fill-opacity="0.6" font-family="ui-monospace, Menlo, monospace" font-size="11">输入框 / 卡片：半透明玻璃</text>

  <!-- 说明列 -->
  <text x="448" y="120" fill="#e8ecf4" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600">插件做了什么</text>

  <line x1="448" y1="140" x2="684" y2="140" stroke="#243044" stroke-width="1"/>

  <text x="448" y="168" fill="#9fb0c9" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">1. 挂一个固定背景层，放图片 / 视频</text>
  <text x="448" y="196" fill="#9fb0c9" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">2. 把应用底色设为透明，背景透上来</text>
  <text x="448" y="224" fill="#9fb0c9" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">3. 覆盖主题变量，面板变成半透明</text>
  <text x="448" y="252" fill="#9fb0c9" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">4. 文字层不动，始终清晰</text>

  <text x="448" y="286" fill="#6f7d92" font-family="ui-monospace, Menlo, monospace" font-size="11">停用 / 卸载 → 移除图层，还原主题</text>

  <!-- 参数 -->
  <rect x="36" y="344" width="648" height="24" rx="8" fill="#182031"/>
  <text x="52" y="360" fill="#8b98ad" font-family="ui-monospace, Menlo, monospace" font-size="11.5">面板不透明度 0–100% · 素材不透明度 10–100% · 模糊 0–40px · 暗化 0–80%</text>
</svg>
